name: Build FFABPICS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java (requis par Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances npm
        run: npm install

      - name: Synchroniser le projet Capacitor
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publier l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: FFABPICS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
